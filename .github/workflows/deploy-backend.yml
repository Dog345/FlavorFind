name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to DigitalOcean (flavorfind.co.ke)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            echo "📦 Pulling latest production branch..."
            cd /var/www/flavorfind
            git fetch origin production
            git reset --hard origin/production

            # ── Backend ──────────────────────────────────────────
            echo "🔧 [Backend] Installing dependencies..."
            cd /var/www/flavorfind/backend

            COMPOSER_ALLOW_SUPERUSER=1 composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction

            echo "🧹 [Backend] Clearing bootstrap cache..."
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            php8.4 artisan package:discover --ansi

            echo "🗄️ [Backend] Running migrations..."
            php8.4 artisan migrate --force

            echo "⚡ [Backend] Caching..."
            php8.4 artisan route:cache
            php8.4 artisan view:cache
            php8.4 artisan event:cache

            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            systemctl reload php8.4-fpm

            # ── Frontend ─────────────────────────────────────────
            echo "🎨 [Frontend] Installing dependencies..."
            cd /var/www/flavorfind/frontend
            npm ci

            echo "🏗️ [Frontend] Building..."
            NEXT_PUBLIC_API_URL=https://api.flavorfind.co.ke/api/v1 npm run build

            echo "🔄 [Frontend] Restarting PM2..."
            pm2 restart flavorfind-web
            pm2 save

            echo "✅ Deployed successfully at $(date)"
            echo "🌐 Frontend: https://flavorfind.co.ke"
            echo "🔌 Backend:  https://api.flavorfind.co.ke"

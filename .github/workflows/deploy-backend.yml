name: Deploy Backend to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'laravel-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/flavorfind

            # Pull latest code
            cd /var/www/flavorfind && git pull origin main

            # Install/update dependencies
            cd laravel-backend && COMPOSER_ALLOW_SUPERUSER=1 php8.4 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction

            # Run migrations
            php8.4 artisan migrate --force

            # Clear and rebuild caches
            php8.4 artisan config:cache
            php8.4 artisan route:cache

            # Fix permissions
            chown -R www-data:www-data storage bootstrap/cache database/database.sqlite database/
            chmod -R 775 storage bootstrap/cache

            echo "✅ Deployed successfully"

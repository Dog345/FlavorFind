name: Deploy Backend to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to DigitalOcean (api.flavorfind.co.ke)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo "📦 Pulling latest production branch..."
            cd /var/www/flavorfind
            git fetch origin production
            git reset --hard origin/production

            cd /var/www/flavorfind/backend

            echo "🔧 Installing composer dependencies..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction

            echo "🗄️ Running migrations..."
            php8.4 artisan migrate --force

            echo "⚡ Caching routes and views..."
            php8.4 artisan route:cache
            php8.4 artisan view:cache
            php8.4 artisan event:cache

            echo "🔐 Setting permissions..."
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            echo "🔄 Reloading PHP-FPM..."
            systemctl reload php8.4-fpm

            echo "✅ Deployed successfully at $(date)"
            echo "🌐 Live at https://api.flavorfind.co.ke"

name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            --url "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
          | grep -q "^2" && echo "✅ Render deploy triggered" || (echo "❌ Deploy hook failed" && exit 1)

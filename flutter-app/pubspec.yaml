name: flavorfind
description: FlavorFind - Recipe Finder App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
